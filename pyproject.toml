[project]
name = "codex-cleaner"
version = "0.1.3"
description = "Safely review and clean local Codex archived sessions and workspace outputs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Codex Cleaner Contributors" }]

[project.scripts]
codex-cleaner = "scripts.codex_cleaner:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
